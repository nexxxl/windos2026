      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.60"/>
    </linearGradient>
    <linearGradient id="glass-bottom" x1="0" y1="0" x2="0" y2="1">
