      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-rim" x1="0.1" y1="0" x2="0.8" y2="1">
