<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="NexlOS liquid glass application icon" data-nexl-variant="B-clipped" data-app-icon="liquid-glass" data-app-icon-density="compact-12" data-handoff-gap="16" data-white-outline="uniform-20">
  <defs>
    <path id="glass-tile" d="M286 64H738C892 64 960 132 960 286V738C960 892 892 960 738 960H286C132 960 64 892 64 738V286C64 132 132 64 286 64Z"/>
    <clipPath id="glass-clip"><use href="#glass-tile"/></clipPath>
    <linearGradient id="glass-body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop stop-color="#FAFCFD" stop-opacity="0.52"/>
      <stop offset="0.38" stop-color="#E1E6E9" stop-opacity="0.30"/>
      <stop offset="0.72" stop-color="#B6BEC3" stop-opacity="0.29"/>
      <stop offset="1" stop-color="#F9FBFC" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="glass-reflection" cx="0.24" cy="0.04" r="0.88">
