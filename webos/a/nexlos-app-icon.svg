  <!-- The canvas is transparent. Every glass fill uses alpha; no wallpaper is embedded. -->
  <use href="#glass-tile" fill="url(#glass-body)" filter="url(#tile-lift)"/>
  <g clip-path="url(#glass-clip)">
    <use href="#glass-tile" fill="url(#glass-reflection)"/>
