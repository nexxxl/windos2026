      <stop offset="0.86" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.44"/>
    </linearGradient>
    <filter id="tile-lift" x="-0.10" y="-0.10" width="1.2" height="1.24" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17212A" flood-opacity="0.11"/>
    </filter>
    <filter id="mark-lift" x="-0.16" y="-0.16" width="1.32" height="1.36" color-interpolation-filters="sRGB">
