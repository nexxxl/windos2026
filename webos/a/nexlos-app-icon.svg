  </g>
  <use href="#glass-tile" fill="none" stroke="#53616C" stroke-opacity="0.10" stroke-width="2"/>
  <use href="#glass-tile" transform="translate(3 3) scale(0.994140625)" fill="none" stroke="url(#glass-rim)" stroke-width="8"/>
