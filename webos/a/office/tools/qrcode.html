<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 嵌入便捷办公时父级传入 ?embed=1；单独双击打开时保持原样。
  if (/(?:^|[?&])embed=1(?:&|$)/.test(location.search)) {
    document.documentElement.className += ' embed';
  }
</script>
<script src="../i18n-office.js"></script>
<title>二维码生成器</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #18181b; background: #f4f4f5;
    -webkit-text-size-adjust: 100%;
  }
  .bar {
    display: flex; flex-wrap: wrap; align-items: baseline;
    padding: 13px 18px; background: #fff; border-bottom: 1px solid #e4e4e7;
  }
  .bar-title { font-size: 15px; font-weight: 600; }
  .bar-note { margin-left: 10px; font-size: 12px; color: #8a8a93; }

  .layout { max-width: 1060px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-start; }
  .pane { width: 100%; background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .pane:last-child { margin-bottom: 0; }
  @media (min-width: 840px) {
    .pane-form { width: 52%; margin-right: 16px; margin-bottom: 0; }
    .pane-out { width: calc(48% - 16px); }
  }

  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .label { font-size: 13px; color: #52525b; margin-bottom: 6px; }
  .label .meta { color: #a1a1aa; margin-left: 6px; }

  textarea {
    width: 100%; min-height: 104px; resize: vertical; padding: 10px 12px;
    font: 13px/1.6 "SF Mono", Menlo, Consolas, monospace;
    color: #18181b; background: #fafafa; border: 1px solid #e4e4e7; border-radius: 8px;
    outline: none;
  }
  textarea:focus { border-color: #a1a1aa; background: #fff; }

  .seg { display: flex; border: 1px solid #d4d4d8; border-radius: 8px; overflow: hidden; }
  .seg button {
    flex: 1 1 0; min-width: 0; padding: 8px 4px; border: 0; background: #fff;
    font: inherit; font-size: 13px; color: #3f3f46; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid #e4e4e7; }
  .seg button[aria-pressed="true"] { background: #18181b; color: #fff; }

  .inline { display: flex; flex-wrap: wrap; align-items: center; }
  .inline > * { margin-right: 8px; margin-bottom: 0; }
  .inline > *:last-child { margin-right: 0; }

  input[type="number"] {
    width: 92px; padding: 7px 8px; font: inherit; font-size: 13px;
    border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b; outline: none;
  }
  input[type="number"]:focus { border-color: #18181b; }
  .unit { font-size: 12px; color: #8a8a93; }

  .chip {
    padding: 5px 10px; font: inherit; font-size: 12px; color: #3f3f46;
    background: #fff; border: 1px solid #d4d4d8; border-radius: 999px; cursor: pointer;
  }
  .chip:hover { border-color: #18181b; }

  input[type="color"] {
    width: 46px; height: 32px; padding: 2px; border: 1px solid #d4d4d8;
    border-radius: 8px; background: #fff; cursor: pointer;
  }
  .hex { font: 12px/1 "SF Mono", Menlo, monospace; color: #8a8a93; }

  input[type="range"] { flex: 1 1 auto; min-width: 100px; }

  .file-row { display: flex; flex-wrap: wrap; align-items: center; }
  .file-label {
    display: inline-block; padding: 7px 12px; font-size: 13px;
    border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; cursor: pointer;
  }
  .file-label:hover { border-color: #18181b; }
  .file-name { font-size: 12px; color: #8a8a93; margin-left: 8px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .canvas-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: 220px; padding: 12px; margin-bottom: 14px;
    background: #fafafa; border: 1px solid #ececef; border-radius: 10px;
  }
  #qrCanvas { display: block; width: 100%; max-width: 340px; height: auto; border-radius: 4px; }
  #qrCanvas.hidden { display: none; }
  .placeholder { font-size: 13px; color: #a1a1aa; text-align: center; padding: 40px 10px; }

  .actions { display: flex; flex-wrap: wrap; }
  .actions > * { margin-right: 8px; margin-bottom: 8px; }
  .actions > *:last-child { margin-right: 0; }
  .btn {
    padding: 9px 16px; font: inherit; font-size: 13px; border-radius: 8px;
    border: 1px solid #d4d4d8; background: #fff; color: #18181b; cursor: pointer;
  }
  .btn:hover { border-color: #18181b; }
  .btn-primary { background: #18181b; border-color: #18181b; color: #fff; }
  .btn-primary:hover { background: #000; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .info { margin-top: 10px; font-size: 12px; color: #71717a; line-height: 1.7; }
  .msg { margin-top: 10px; font-size: 12px; line-height: 1.6; padding: 8px 10px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #fef2f2; color: #b91c1c; }
  .msg.warn { background: #fffbeb; color: #92400e; }
  .msg.ok { background: #f0fdf4; color: #15803d; }

  /* ---------- 嵌入便捷办公：纸张底色 + Office 2003 控件密度 ---------- */
  html.embed body {
    font: 12.5px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #1c1917; background: #faf8f4;
  }
  /* 标题已经在便捷办公的工具窗标题栏里，页内大标题不再重复。 */
  html.embed .bar { display: none; }
  html.embed .layout { max-width: none; padding: 10px 12px 12px; }
  html.embed .pane { border-color: #ded6c8; border-radius: 4px; padding: 12px; }
  html.embed .row { margin-bottom: 11px; }
  html.embed .label { font-size: 11.5px; color: #57534e; margin-bottom: 4px; }
  html.embed .label .meta { color: #8a817a; }
  html.embed textarea {
    min-height: 76px; padding: 6px 8px; border-color: #ded6c8; border-radius: 3px;
    background: #fff; font-size: 12.5px;
  }
  html.embed textarea:focus { border-color: #b45309; background: #fff; }
  html.embed .seg { border-color: #c9c0b2; border-radius: 3px; }
  html.embed .seg button { padding: 5px 4px; font-size: 12px; }
  html.embed .seg button + button { border-left-color: #ded6c8; }
  html.embed .seg button[aria-pressed="true"] { background: #1c1917; }
  html.embed input[type="number"] {
    width: 80px; padding: 4px 6px; font-size: 12px;
    border-color: #c9c0b2; border-radius: 3px;
  }
  html.embed input[type="color"] {
    width: 38px; height: 26px; padding: 1px; border-color: #c9c0b2; border-radius: 3px;
  }
  html.embed .chip { padding: 3px 8px; font-size: 11.5px; border-color: #c9c0b2; border-radius: 3px; }
  html.embed .file-label { padding: 5px 10px; font-size: 12px; border-color: #c9c0b2; border-radius: 3px; background: #fbf9f5; }
  html.embed .canvas-wrap { min-height: 180px; margin-bottom: 10px; border-color: #ded6c8; border-radius: 4px; background: #fff; }
  html.embed .btn {
    padding: 5px 12px; font-size: 12px; border-color: #c9c0b2; border-radius: 3px;
    background: #fbf9f5;
  }
  html.embed .btn:hover { border-color: #1c1917; background: #fff; }
  html.embed .btn-primary { background: #1c1917; border-color: #1c1917; color: #fff; }
  html.embed .btn-primary:hover { background: #000; border-color: #000; }
  html.embed .info { font-size: 11.5px; color: #8a817a; }
  html.embed .msg { border-radius: 3px; font-size: 11.5px; }
  /* 原生滑块在 Chrome 里是系统蓝，换成与便捷办公一致的琥珀色细轨。 */
  html.embed input[type="range"] { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; }
  html.embed input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; background: #ded6c8; border: 1px solid #c9c0b2; border-radius: 2px;
  }
  html.embed input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 12px; height: 12px; margin-top: -5px;
    background: #b45309; border: 1px solid #8a3f07; border-radius: 2px;
  }
  @media (max-width: 600px) {
    html.embed .layout { padding: 8px 10px 12px; }
    html.embed .pane { padding: 10px; }
    html.embed .btn { padding: 7px 12px; }
    html.embed .chip { padding: 5px 9px; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-title">二维码生成器</div>
  <div class="bar-note">离线运行 · 内容不会上传</div>
</div>

<div class="layout">
  <section class="pane pane-form">
    <div class="row">
      <div class="label">内容 <span class="meta" id="byteInfo">0 字节</span></div>
      <textarea id="text" placeholder="粘贴网址或输入任意文字"></textarea>
    </div>

    <div class="row">
      <div class="label">纠错级别 <span class="meta">级别越高越抗污损，容量越小</span></div>
      <div class="seg" id="levelSeg">
        <button type="button" data-level="L" aria-pressed="false">L · 低</button>
        <button type="button" data-level="M" aria-pressed="true">M · 中</button>
        <button type="button" data-level="Q" aria-pressed="false">Q · 较高</button>
        <button type="button" data-level="H" aria-pressed="false">H · 高</button>
      </div>
    </div>

    <div class="row">
      <div class="label">输出尺寸 <span class="meta">下载的 PNG 按此像素输出</span></div>
      <div class="inline">
        <input type="number" id="size" min="128" max="2048" step="16" value="512">
        <span class="unit">px</span>
        <button type="button" class="chip" data-size="256">256</button>
        <button type="button" class="chip" data-size="512">512</button>
        <button type="button" class="chip" data-size="1024">1024</button>
      </div>
    </div>

    <div class="row">
      <div class="label">颜色</div>
      <div class="inline">
        <input type="color" id="fg" value="#000000" title="前景色">
        <span class="hex" id="fgHex">#000000</span>
        <span class="unit">前景</span>
        <input type="color" id="bg" value="#ffffff" title="背景色">
        <span class="hex" id="bgHex">#ffffff</span>
        <span class="unit">背景</span>
      </div>
    </div>

    <div class="row">
      <div class="label">中心 Logo <span class="meta">可选，会自动加底色与圆角</span></div>
      <div class="file-row">
        <label class="file-label" for="logoFile">选择图片</label>
        <input type="file" id="logoFile" accept="image/*">
        <span class="file-name" id="logoName">未选择</span>
        <button type="button" class="chip" id="logoClear" style="margin-left:8px;display:none">移除</button>
      </div>
    </div>

    <div class="row">
      <div class="label">Logo 占比 <span class="meta" id="ratioInfo">20%</span></div>
      <div class="inline">
        <input type="range" id="ratio" min="10" max="26" step="1" value="20">
      </div>
    </div>
  </section>

  <section class="pane pane-out">
    <div class="canvas-wrap">
      <div class="placeholder" id="placeholder">在左侧输入内容，这里会生成二维码</div>
      <canvas id="qrCanvas" class="hidden"></canvas>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="downloadBtn">下载 PNG</button>
      <button type="button" class="btn" id="copyBtn">复制图片</button>
    </div>

    <div class="info" id="codeInfo"></div>
    <div class="msg" id="msg"></div>
  </section>
</div>

<script>
/*
 * QR Code generator library (TypeScript)
 *
 * Copyright (c) Project Nayuki. (MIT License)
 * https://www.nayuki.io/page/qr-code-generator-library
 *
 * Permission is hereby granted, free of charge, to any person obtaining a copy of

 * the Software without restriction, including without limitation the rights to
 * use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of
 * the Software, and to permit persons to whom the Software is furnished to do so,
 * subject to the following conditions:
 * - The above copyright notice and this permission notice shall be included in
 *   all copies or substantial portions of the Software.
 * - The Software is provided "as is", without warranty of any kind, express or
 *   implied, including but not limited to the warranties of merchantability,
 *   fitness for a particular purpose and noninfringement. In no event shall the
 *   authors or copyright holders be liable for any claim, damages or other
 *   liability, whether in an action of contract, tort or otherwise, arising from,
 *   out of or in connection with the Software or the use or other dealings in the
 *   Software.
 */
"use strict";
var qrcodegen;
(function (qrcodegen) {
    /*---- QR Code symbol class ----*/
    /*
     * A QR Code symbol, which is a type of two-dimension barcode.
     * Invented by Denso Wave and described in the ISO/IEC 18004 standard.
     * Instances of this class represent an immutable square grid of dark and light cells.
     * The class provides static factory functions to create a QR Code from text or binary data.
     * The class covers the QR Code Model 2 specification, supporting all versions (sizes)
     * from 1 to 40, all 4 error correction levels, and 4 character encoding modes.
     *
     * Ways to create a QR Code object:
     * - High level: Take the payload data and call QrCode.encodeText() or QrCode.encodeBinary().
     * - Mid level: Custom-make the list of segments and call QrCode.encodeSegments().
     * - Low level: Custom-make the array of data codeword bytes (including
     *   segment headers and final padding, excluding error correction codewords),
     *   supply the appropriate version number, and call the QrCode() constructor.
     * (Note that all ways require supplying the desired error correction level.)
     */
    class QrCode {
        /*-- Static factory functions (high level) --*/
        // Returns a QR Code representing the given Unicode text string at the given error correction level.
        // As a conservative upper bound, this function is guaranteed to succeed for strings that have 738 or fewer
        // Unicode code points (not UTF-16 code units) if the low error correction level is used. The smallest possible
        // QR Code version is automatically chosen for the output. The ECC level of the result may be higher than the
        // ecl argument if it can be done without increasing the version.
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        // Returns a QR Code representing the given binary data at the given error correction level.
        // This function always encodes using the binary segment mode, not any text mode. The maximum number of
        // bytes allowed is 2953. The smallest possible QR Code version is automatically chosen for the output.
        // The ECC level of the result may be higher than the ecl argument if it can be done without increasing the version.
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        /*-- Static factory functions (mid level) --*/
        // Returns a QR Code representing the given segments with the given encoding parameters.
        // The smallest possible QR Code version within the given range is automatically
        // chosen for the output. Iff boostEcl is true, then the ECC level of the result
        // may be higher than the ecl argument if it can be done without increasing the
        // version. The mask number is either between 0 to 7 (inclusive) to force that
        // mask, or -1 to automatically choose an appropriate mask (which may be slow).
        // This function allows the user to create a custom sequence of segments that switches
        // between modes (such as alphanumeric and byte) to encode text in less space.
        // This is a mid-level API; the high-level API is encodeText() and encodeBinary().
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            // Find the minimal version number to use
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8; // Number of data bits available
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break; // This version number is found to be suitable
                }
                if (version >= maxVersion) // All versions in the range could not fit the given data
                    throw new RangeError("Data too long");
            }
            // Increase the error correction level while the data still fits in the current version number
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) { // From low to high
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            // Concatenate all segments to create the data bit string
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            // Add terminator and pad up to a byte if applicable
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            // Pad with alternating bytes until data capacity is reached
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
                appendBits(padByte, 8, bb);
            // Pack bits into bytes in big endian
            let dataCodewords = [];
            while (dataCodewords.length * 8 < bb.length)
                dataCodewords.push(0);
            bb.forEach((b, i) => dataCodewords[i >>> 3] |= b << (7 - (i & 7)));
            // Create the QR Code object
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        /*-- Constructor (low level) and fields --*/
        // Creates a new QR Code with the given version number,
        // error correction level, data codeword bytes, and mask number.
        // This is a low-level API that most users should not use directly.
        // A mid-level API is the encodeSegments() function.
        constructor(
        // The version number of this QR Code, which is between 1 and 40 (inclusive).
        // This determines the size of this barcode.
        version, 
        // The error correction level used in this QR Code.
        errorCorrectionLevel, dataCodewords, msk) {
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            // The modules of this QR Code (false = light, true = dark).
            // Immutable after constructor finishes. Accessed through getModule().
            this.modules = [];
            // Indicates function modules that are not subjected to masking. Discarded when constructor finishes.
            this.isFunction = [];
            // Check scalar arguments
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION)
                throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7)
                throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            // Initialize both grids to be size*size arrays of Boolean false
            let row = [];
            for (let i = 0; i < this.size; i++)
                row.push(false);
            for (let i = 0; i < this.size; i++) {
                this.modules.push(row.slice()); // Initially all light
                this.isFunction.push(row.slice());
            }
            // Compute ECC, draw modules
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            // Do masking
            if (msk == -1) { // Automatically choose best mask
                let minPenalty = 1000000000;
                for (let i = 0; i < 8; i++) {
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i); // Undoes the mask due to XOR
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk); // Apply the final choice of mask
            this.drawFormatBits(msk); // Overwrite old format bits
            this.isFunction = [];
        }
        /*-- Accessor methods --*/
        // Returns the color of the module (pixel) at the given coordinates, which is false
        // for light or true for dark. The top left corner has the coordinates (x=0, y=0).
        // If the given coordinates are out of bounds, then false (light) is returned.
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        /*-- Private helper methods for constructor: Drawing function modules --*/
        // Reads this object's version field, and draws and marks all function modules.
        drawFunctionPatterns() {
            // Draw horizontal and vertical timing patterns
            for (let i = 0; i < this.size; i++) {
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            // Draw 3 finder patterns (all corners except bottom right; overwrites some timing modules)
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            // Draw numerous alignment patterns
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for (let i = 0; i < numAlign; i++) {
                for (let j = 0; j < numAlign; j++) {
                    // Don't draw on the three finder corners
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0))
                        this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            // Draw configuration data
            this.drawFormatBits(0); // Dummy mask value; overwritten later in the constructor
            this.drawVersion();
        }
        // Draws two copies of the format bits (with its own error correction code)
        // based on the given mask and this object's error correction level field.
        drawFormatBits(mask) {
            // Calculate error correction code and pack bits
            const data = this.errorCorrectionLevel.formatBits << 3 | mask; // errCorrLvl is uint2, mask is uint3
            let rem = data;
            for (let i = 0; i < 10; i++)
                rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412; // uint15
            assert(bits >>> 15 == 0);
            // Draw first copy
            for (let i = 0; i <= 5; i++)
                this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)
                this.setFunctionModule(14 - i, 8, getBit(bits, i));
            // Draw second copy
            for (let i = 0; i < 8; i++)
                this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++)
                this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));

        /*-- Methods --*/
        // Returns a new copy of the data bits of this segment.

        // the given version. The result is infinity if a segment has too many characters to fit its length field.

        Ecc.LOW = new Ecc(0, 1); // The QR Code can tolerate about  7% erroneous codewords
        Ecc.MEDIUM = new Ecc(1, 0); // The QR Code can tolerate about 15% erroneous codewords
        Ecc.QUARTILE = new Ecc(2, 3); // The QR Code can tolerate about 25% erroneous codewords

/*---- Public helper enumeration ----*/
(function (qrcodegen) {
    var QrSegment;
    (function (QrSegment) {
        /*
         * Describes how a segment's data bits are interpreted. Immutable.
         */
        class Mode {
            /*-- Constructor and fields --*/

            // The mode indicator bits, which is a uint4 value (range 0 to 15).
            modeBits,

                this.numBitsCharCount = numBitsCharCount;

</script>

<script>
(function () {
  'use strict';

  var MAX_BYTES = { L: 2953, M: 2331, Q: 1663, H: 1273 };
  var ECC = null;

  var state = {
    level: 'M',
    size: 512,
    fg: '#000000',
    bg: '#ffffff',
    ratio: 0.20,
    logo: null,
    logoName: ''
  };

  var elText = document.getElementById('text');
  var elSize = document.getElementById('size');
  var elFg = document.getElementById('fg');
  var elBg = document.getElementById('bg');
  var elRatio = document.getElementById('ratio');
  var elCanvas = document.getElementById('qrCanvas');
  var elPlaceholder = document.getElementById('placeholder');
  var elMsg = document.getElementById('msg');
  var elInfo = document.getElementById('codeInfo');
  var elByteInfo = document.getElementById('byteInfo');
  var elRatioInfo = document.getElementById('ratioInfo');

  var ctx = elCanvas.getContext('2d');
  var lastQr = null;
  var timer = null;

  ECC = {
    L: qrcodegen.QrCode.Ecc.LOW,
    M: qrcodegen.QrCode.Ecc.MEDIUM,
    Q: qrcodegen.QrCode.Ecc.QUARTILE,
    H: qrcodegen.QrCode.Ecc.HIGH
  };

  function utf8Length(str) {
    var n = 0;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else if (c >= 0xD800 && c <= 0xDBFF) { n += 4; i++; }
      else n += 3;
    }
    return n;
  }

  function showMsg(text, kind) {
    if (!text) { elMsg.className = 'msg'; elMsg.textContent = ''; return; }
    elMsg.className = 'msg show ' + (kind || 'warn');
    elMsg.textContent = text;
  }

  function parseHex(color) {
    var v = color.replace('#', '');
    if (v.length === 3) v = v[0] + v[0] + v[1] + v[1] + v[2] + v[2];
    return {
      r: parseInt(v.substring(0, 2), 16),
      g: parseInt(v.substring(2, 4), 16),
      b: parseInt(v.substring(4, 6), 16)
    };
  }

  function luminance(color) {
    var c = parseHex(color);
    var parts = [c.r, c.g, c.b];
    var lum = 0;
    var weights = [0.2126, 0.7152, 0.0722];
    for (var i = 0; i < 3; i++) {
      var v = parts[i] / 255;
      v = v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      lum += v * weights[i];
    }
    return lum;
  }

  function contrastRatio(a, b) {
    var la = luminance(a), lb = luminance(b);
    var hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }

  function roundRect(context, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    context.beginPath();
    context.moveTo(x + r, y);
    context.lineTo(x + w - r, y);
    context.arcTo(x + w, y, x + w, y + r, r);
    context.lineTo(x + w, y + h - r);
    context.arcTo(x + w, y + h, x + w - r, y + h, r);
    context.lineTo(x + r, y + h);
    context.arcTo(x, y + h, x, y + h - r, r);
    context.lineTo(x, y + r);
    context.arcTo(x, y, x + r, y, r);
    context.closePath();
  }

  function draw() {
    var text = elText.value;
    var bytes = utf8Length(text);
    elByteInfo.textContent = OT('{0} 字节 / 上限约 {1} 字节', bytes, MAX_BYTES[state.level]);

    if (!text) {
      elCanvas.className = 'hidden';
      elPlaceholder.style.display = '';
      elInfo.textContent = '';
      lastQr = null;
      showMsg('');
      return;
    }

    var qr = null;
    try {
      qr = qrcodegen.QrCode.encodeSegments(
        qrcodegen.QrSegment.makeSegments(text), ECC[state.level], 1, 40, -1, false
      );
    } catch (err) {
      elCanvas.className = 'hidden';
      elPlaceholder.style.display = '';
      lastQr = null;
      showMsg(OT('内容超出容量：当前纠错级别最多约 {0} 字节（UTF-8），请缩短内容或改用更低的纠错级别。', MAX_BYTES[state.level]), 'err');
      return;
    }

    lastQr = qr;
    elPlaceholder.style.display = 'none';
    elCanvas.className = '';

    var size = state.size;
    elCanvas.width = size;
    elCanvas.height = size;

    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, size, size);

    var total = qr.size + 8;              // 四周各留 4 模块静区，扫码器需要
    var mod = Math.floor(size / total);
    if (mod < 1) mod = 1;
    var off = Math.floor((size - mod * total) / 2);

    ctx.fillStyle = state.fg;
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (qr.getModule(x, y)) {
          ctx.fillRect(off + (x + 4) * mod, off + (y + 4) * mod, mod, mod);
        }
      }
    }

    if (state.logo) {
      drawLogo(size, mod);
    }

    elInfo.textContent = OT('版本 {0} · {1}×{1} 模块 · 纠错 {2} · 输出 {3}×{3} px',
      qr.version, qr.size, state.level, size);

    var ratio = contrastRatio(state.fg, state.bg);
    if (ratio < 3) {
      showMsg(OT('前景与背景对比度偏低（{0}:1），部分扫码器可能识别失败，建议加深前景色或提亮背景。', ratio.toFixed(1)), 'warn');
    } else if (state.logo && state.level !== 'H') {
      showMsg(OT('已叠加 Logo。遮挡会吃掉部分码字，建议把纠错级别调到 H 再导出。'), 'warn');
    } else if (state.logo && state.ratio > 0.22) {
      showMsg(OT('Logo 占比较大，建议缩小到 22% 以内，导出后先扫一次确认。'), 'warn');
    } else if (state.logo) {
      showMsg(OT('已叠加 Logo，导出后建议先扫一次确认。'), 'ok');
    } else {
      showMsg('');
    }
  }

  function drawLogo(size, mod) {
    var box = Math.round(size * state.ratio);
    var x = Math.round((size - box) / 2);
    var y = Math.round((size - box) / 2);
    var radius = Math.round(box * 0.18);

    ctx.save();
    roundRect(ctx, x, y, box, box, radius);
    ctx.fillStyle = state.bg;
    ctx.fill();
    ctx.restore();

    // 留白至少一个模块宽，扫码器需要足够的空区
    var pad = Math.max(Math.round(box * 0.10), mod);
    var inner = box - pad * 2;
    var iw = state.logo.naturalWidth || state.logo.width;
    var ih = state.logo.naturalHeight || state.logo.height;
    if (!iw || !ih) return;
    var scale = Math.min(inner / iw, inner / ih);
    var dw = iw * scale;
    var dh = ih * scale;
    ctx.drawImage(state.logo, x + (box - dw) / 2, y + (box - dh) / 2, dw, dh);
  }

  function scheduleDraw() {
    clearTimeout(timer);
    timer = setTimeout(draw, 120);
  }

  function setLevel(level) {
    state.level = level;
    var buttons = document.querySelectorAll('#levelSeg button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].getAttribute('data-level') === level ? 'true' : 'false');
    }
    draw();
  }

  function clampSize(value) {
    var v = parseInt(value, 10);
    if (isNaN(v)) v = 512;
    if (v < 128) v = 128;
    if (v > 2048) v = 2048;
    return v;
  }

  elText.addEventListener('input', scheduleDraw);

  document.getElementById('levelSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) setLevel(btn.getAttribute('data-level'));
  });

  function applySizeInput() {
    state.size = clampSize(elSize.value);
    elSize.value = state.size;
    draw();
  }
  elSize.addEventListener('change', applySizeInput);
  elSize.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(applySizeInput, 400);
  });

  var sizeChips = document.querySelectorAll('.chip[data-size]');
  for (var i = 0; i < sizeChips.length; i++) {
    sizeChips[i].addEventListener('click', function (e) {
      state.size = clampSize(e.currentTarget.getAttribute('data-size'));
      elSize.value = state.size;
      draw();
    });
  }

  elFg.addEventListener('input', function () {
    state.fg = elFg.value;
    document.getElementById('fgHex').textContent = state.fg;
    draw();
  });

  elBg.addEventListener('input', function () {
    state.bg = elBg.value;
    document.getElementById('bgHex').textContent = state.bg;
    draw();
  });

  elRatio.addEventListener('input', function () {
    state.ratio = parseInt(elRatio.value, 10) / 100;
    elRatioInfo.textContent = elRatio.value + '%';
    draw();
  });

  document.getElementById('logoFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        state.logo = img;
        state.logoName = file.name;
        var logoName = document.getElementById('logoName');
        // 文件名是用户内容：标记后不参与界面翻译。
        logoName.setAttribute('data-i18n-skip', '');
        logoName.textContent = file.name;
        document.getElementById('logoClear').style.display = '';
        draw();
      };
      img.onerror = function () { showMsg(OT('这个文件无法作为图片读取，请换一张 PNG/JPG。'), 'err'); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('logoClear').addEventListener('click', function () {
    state.logo = null;
    state.logoName = '';
    var logoName = document.getElementById('logoName');
    logoName.removeAttribute('data-i18n-skip');
    logoName.textContent = OT('未选择');
    document.getElementById('logoClear').style.display = 'none';
    document.getElementById('logoFile').value = '';
    draw();
  });

  function fileBase() {
    return 'qrcode-' + state.size + '-' + state.level;
  }

  document.getElementById('downloadBtn').addEventListener('click', function () {
    if (!lastQr) { showMsg(OT('先输入内容再下载。'), 'warn'); return; }
    if (!elCanvas.toBlob) {
      var a = document.createElement('a');
      a.href = elCanvas.toDataURL('image/png');
      a.download = fileBase() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return;
    }
    elCanvas.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fileBase() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      showMsg(OT('已下载 PNG（{0}×{0}）。', state.size), 'ok');
    }, 'image/png');
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (!lastQr) { showMsg(OT('先输入内容再复制。'), 'warn'); return; }
    if (!navigator.clipboard || !window.ClipboardItem) {
      showMsg(OT('当前浏览器不支持复制图片，请用「下载 PNG」。'), 'warn');
      return;
    }
    elCanvas.toBlob(function (blob) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        showMsg(OT('二维码图片已复制到剪贴板。'), 'ok');
      }).catch(function () {
        showMsg(OT('浏览器拒绝了剪贴板写入，请用「下载 PNG」。'), 'warn');
      });
    }, 'image/png');
  });

  // 首次进入给一个可用的默认值，方便马上看到效果
  elText.value = 'https://example.com';
  elRatioInfo.textContent = elRatio.value + '%';
  draw();
})();
</script>
</body>
</html>
