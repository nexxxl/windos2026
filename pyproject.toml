[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "node_modules",
  "dist",
  "src/vendor",
  "src/webos/a/vendor",
]

[tool.ruff.lint]
# 第一阶段只拦截语法错误和未定义名称，避免历史代码产生大量无关告警。
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
