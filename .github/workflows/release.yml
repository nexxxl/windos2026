name: release

# 插件版是这一棵树的唯一发布物，它不创建 GitHub Release：
# 通用版（Windows/macOS 自包含二进制）通过 update-feed 与本仓的 Release 页发布，
# 插件版通过 install_bundle / npm 获取。两条链路的发布位不能互相抢占，
# 所以这里只做「标签 = 版本」的校验与产物留档。
on:
  push:
    tags: ['plugin-v*']

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin tarball (verification only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Tag matches package.json
        run: |
          want="plugin-v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $want" >&2
            exit 1
          fi

      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: python3 scripts/check-source.py
      - run: python3 scripts/audit-release.py
      - run: bash scripts/stage-public-repo.sh --check-repo .

      - name: Pack
        # dist/ 被 .gitignore 忽略，干净 runner 上并不存在；先建目录再打包。
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Contract test on the packed artifact
        run: |
          mkdir -p /tmp/pkgext
          tar -xzf dist/nexlos-os-*.tgz -C /tmp/pkgext
          NEXLOS_TEST_PACKAGE=/tmp/pkgext/package npm test

      # 留档给维护者与 DSH/Octop 分发自检用；它不是 Release，也不会出现在下载页。
      - name: Upload the tarball as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nexlos-os-${{ github.ref_name }}
          path: dist/nexlos-os-*.tgz
          if-no-files-found: error
          retention-days: 90

      - name: Publishing is a human step
        run: |
          echo "Tarball built and verified. Publishing to npm is a human action with provenance."
