name: codeql

# 静态分析在公开仓上免费；私有仓需要 GHAS，所以显式跳过，不制造红叉。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: javascript-typescript
          # 安全查询用 security-extended；quality 套件会把未使用变量之类的
          # 可维护性提示一并算进 code scanning（曾达 104/149 条），质量检查交给 lint。
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
