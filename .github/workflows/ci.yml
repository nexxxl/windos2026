name: plugin-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly dependency audit; failures show up here instead of blocking a PR
    # on a registry advisory published mid-review.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-source.py

  plugin:
    name: Standalone plugin (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the supported floor (package.json engines); 24 and 26 are the
        # current LTS and current release. All three must stay green.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      # 打包产物才是用户真正拿到的东西：解开再跑一遍契约测试。跑一次就够。
      - name: Contract test on the packed artifact
        if: matrix.node == '22'
        run: |
          mkdir -p /tmp/pkgext
          npm pack --pack-destination /tmp
          tar -xzf /tmp/nexlos-os-*.tgz -C /tmp/pkgext
          NEXLOS_TEST_PACKAGE=/tmp/pkgext/package npm test

  audit:
    name: Dependency audit (production)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    # Private repositories need GitHub Advanced Security for this action; it
    # activates on the first pull request after the repository goes public.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  python-tools:
    name: Optional companion Python source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: Ruff syntax and undefined names
        run: |
          if [ -d tools ]; then
            ruff check tools scripts
          else
            ruff check scripts
          fi

  format:
    # 只检查维护中的模块（src/capabilities.js、test/、scripts/ 的 .mjs）。src/webos/ 与既有文档
    # 保持项目原有排版，不在这里批量重排；范围写明，避免长期一条永远红的假信号。
    name: Formatting (lib, test, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes prettier@3 --check "src/capabilities.js" "test/**/*.mjs" "scripts/*.mjs"

  public-scope:
    # fail-closed：不再按目录嗅探决定跑不跑。漏进一个 applications/ 或 tools/
    # 恰好是最该拦的时候，跳过等于放行，所以这个 job 每次都跑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the repository tree itself
        # 影子树永远干净，查它拦不住「tools/ 被直接提交进仓库」。
        # 这一条对着 git 索引查：排除目录、私钥、.env 一个都不能在里面。
        run: bash scripts/stage-public-repo.sh --check-repo .
      - name: Check the public source boundary
        # 生成候选树再校验：直接 check 仓库根会被 .git 干扰，且查的不是发布形态。
        run: |
          bash scripts/stage-public-repo.sh /tmp/public-candidate
          bash scripts/stage-public-repo.sh --check /tmp/public-candidate
      - name: Boundary negative cases
        # 反向证明：applications/、tools/、src/extras/fonts-cjk、私钥、开发者路径、
        # 被提交的 .env 都必须被拒，干净树必须通过。
        run: node --test test/public-boundary.test.mjs
